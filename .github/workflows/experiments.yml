# The engine. Every 6 hours: plan what is left -> run it in parallel shards -> merge -> report -> commit.
# When the queue is empty it freezes the next replication wave on schedule (waves.py), so it keeps going.
# Self-resuming: every episode is written as it finishes; anything unfinished is re-planned next run.
# Self-limiting: gates in `axiom plan` block work until the fit, baselines and task freeze are in order,
# and the adaptive seed rule stops a cell once its result is precise enough.
name: experiments
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # collect re-reads shard artifacts of earlier runs whose collect failed

concurrency:
  group: experiments
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      setup: ${{ steps.plan.outputs.setup }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      # A scheduled run that waited in the queue must plan against the ledger as it is now,
      # not as it was when the run was triggered, or it repeats work the previous run did.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.11 && uv pip install -e .
      - id: plan
        env:
          AXIOM_HOSTED: ${{ secrets.OPENROUTER_API_KEY != '' && '1' || '' }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          .venv/bin/axiom plan --out plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json

  # One-time setup, run automatically when missing: fit ERP CORE -> oracle designs -> freeze tasks.
  setup:
    needs: plan
    if: needs.plan.outputs.setup != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.11 && uv pip install -e ".[fit]"
      - name: Fit simulator to ERP CORE (validation result is committed either way)
        if: contains(needs.plan.outputs.setup, 'fit')
        run: .venv/bin/axiom fit-erpcore || echo "::warning::ERP CORE validation failed; gates will hold all runs"
      - name: Simulation-optimal oracle designs
        if: contains(needs.plan.outputs.setup, 'oracle') || contains(needs.plan.outputs.setup, 'fit')
        run: .venv/bin/axiom oracle
      - name: Freeze task set
        if: contains(needs.plan.outputs.setup, 'freeze')
        run: .venv/bin/axiom freeze
      - name: Bio lab (fetch Sachs cells, freeze bio tasks)
        if: contains(needs.plan.outputs.setup, 'bio')
        run: .venv/bin/axiom bio-setup
      - name: Claim labs (fetch data, freeze tasks)
        if: contains(needs.plan.outputs.setup, 'lab:')
        run: .venv/bin/axiom lab-setup
      - name: Freeze the next replication wave (fresh, never-seen tasks)
        if: contains(needs.plan.outputs.setup, 'wave')
        run: .venv/bin/axiom freeze-wave
      - run: .venv/bin/axiom report
      - name: Commit setup outputs
        run: |
          git config user.name "axiom-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ results/oracle_designs.json results/RESULTS.md results/summary.json tasks/ README.md
          git diff --cached --quiet && exit 0
          git commit -m "setup: ${{ needs.plan.outputs.setup }} (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i * 10)); done; exit 1

  run:
    needs: plan
    if: needs.plan.outputs.has_work == 'true' && needs.plan.outputs.setup == ''
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Default: free GitHub-hosted runner. Set repo variable AXIOM_RUNNER=self-hosted to use your own machine.
    runs-on: ${{ vars.AXIOM_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.11 && uv pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - name: Start Ollama and pull ${{ matrix.model }}
        if: matrix.model != 'none' && !matrix.hosted
        run: |
          for i in 1 2 3; do command -v ollama && break; curl -fsSL https://ollama.com/install.sh | sh || sleep $((i * 20)); done
          command -v ollama
          curl -sf http://127.0.0.1:11434/api/tags >/dev/null || (nohup ollama serve >/tmp/ollama.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          for i in 1 2 3 4 5; do ollama pull "${{ matrix.model }}" && break; [ $i = 5 ] && exit 1; sleep $((i * 20)); done
      - name: Run shard ${{ matrix.shard }}
        env:
          OPENROUTER_API_KEY: ${{ matrix.hosted && secrets.OPENROUTER_API_KEY || '' }}
        run: |
          .venv/bin/axiom run --plan plan.json --shard ${{ matrix.shard }} --budget-min 320 \
            --out results/incoming/${{ github.run_id }}-${{ matrix.shard }}.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: |
            results/incoming/
            results/transcripts/
          if-no-files-found: ignore

  collect:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.has_work == 'true' && needs.plan.outputs.setup == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.11 && uv pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: results/
          merge-multiple: true
      # If an earlier run's collect failed, its shards' episodes are still in its artifacts (kept 90 days).
      # Pull them in here; collect skips any attempt the ledger already has, so this never double-counts.
      - name: Recover shards from earlier runs whose collect failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '14 days ago' +%s)
          gh run list --workflow experiments.yml --status failure --limit 30 --json databaseId,createdAt \
            --jq ".[] | select((.createdAt | fromdateiso8601) > $since) | .databaseId" |
          while read -r id; do
            [ "$id" = "${{ github.run_id }}" ] && continue
            d=$(mktemp -d)
            gh run download "$id" --pattern 'shard-*' --dir "$d" 2>/dev/null || { echo "run $id: no shard artifacts"; continue; }
            for s in "$d"/shard-*; do cp -r "$s"/. results/; done
            echo "run $id: re-read $(ls "$d" | wc -l) shard artifacts"
          done
      - name: Merge into the latest ledger and commit (only when there is new data)
        # Rebuild on top of whatever main is now instead of rebasing generated files, which conflict.
        # collect is idempotent (by attempt id), so retrying after a race is safe.
        run: |
          git config user.name "axiom-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            .venv/bin/axiom collect && .venv/bin/axiom report && .venv/bin/axiom study-report
            git add results/ README.md  # results/incoming is gitignored; naming it here makes git add exit 1
            git diff --cached --quiet && { echo "no new results"; exit 0; }
            n=$(git diff --cached --numstat results/ledger.jsonl | awk '{print $1}')
            git commit -q -m "results: +${n:-0} ledger rows (run ${{ github.run_id }})"
            git push origin HEAD:main && exit 0
            sleep $((i * 15))
          done
          exit 1
