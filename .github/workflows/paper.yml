# Builds the paper PDF and an Overleaf-ready zip on any branch that touches the paper.
# Download both from the run's "axiom-paper" artifact; the site workflow publishes them from main.
name: paper
on:
  push:
    paths: [paper/**, src/axiom_neuro/figures.py, .github/workflows/paper.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.11 && uv pip install -e ".[viz]"
      - run: .venv/bin/axiom figures && .venv/bin/axiom paper-tables
      - name: Build PDF (tectonic, free)
        run: |
          curl -fsSL https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo mv tectonic /usr/local/bin/
          mkdir -p paper/figures && cp site/figures/*.pdf paper/figures/
          cd paper && tectonic main.tex
      - name: Overleaf zip (upload via New Project → Upload Project)
        run: cd paper && zip -r ../axiom-neuro-overleaf.zip main.tex refs.bib generated figures
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-paper
          path: |
            paper/main.pdf
            axiom-neuro-overleaf.zip
